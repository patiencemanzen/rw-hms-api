services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rwhms
      POSTGRES_PASSWORD: rwhms_dev_password
      POSTGRES_DB: rw_hms
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rwhms -d rw_hms']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025'
      - '8025:8025'

  minio:
    profiles: ['storage']
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: rwhms_minio
      MINIO_ROOT_PASSWORD: rwhms_minio_dev_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    profiles: ['storage']
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 rwhms_minio rwhms_minio_dev_password &&
      mc mb --ignore-existing local/rw-hms-documents
      "

volumes:
  pgdata:
  miniodata:
